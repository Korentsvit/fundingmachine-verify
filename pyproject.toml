[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundingmachine-verify"
version = "0.1.0"
description = "Independent verifier for FundingMachine certificates and their anchors"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=44"]
interop = ["opentimestamps>=0.4.5", "pypdf>=4"]

[project.scripts]
fm-verify = "fmverify.cli:main"

[project.urls]
Source = "https://github.com/Korentsvit/fundingmachine-verify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
