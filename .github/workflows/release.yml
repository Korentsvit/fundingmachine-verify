name: release

# Publishes a tagged release of fm-verify (a tag v*): the wheel, the source archive and the
# conformance fixture archive, each rebuilt byte for byte from the tag, the scoreboard recomputed
# from it (tools/scoreboard.py), the fleet's scoreboard-manifest.json (contract scoreboard-manifest
# 1.0) with each figure read from the file the conformance run on the commit kept, and their
# SHA-256 values.
# Nothing is published unless the two-key gate passes for the tagged commit (gate/README.md), the
# version matches the tag, and CHANGELOG.md has the version's section.
#
# Then the same files go to the public release location (Filipp, 8 November 2026): the Vercel Blob store
# capital-graph-public, under verify-vX.Y.Z/, with LICENSE, ATTRIBUTION.txt, manifest.json and SHA256SUMS
# (tools/blob_release.py). The blob job downloads the published release, checks every file against its SHA256SUMS
# and the gate record on main against the commit, uploads with the store's token (secret CAPITAL_GRAPH_BLOB_TOKEN,
# used in that one job), and checks that the store serves every file as assembled. Run by hand with upload_tag, it
# does the same for a release already published, after the gate passes for that tag's commit, with the tag's own code:
# a tag whose tree has no tools/blob_release.py is refused, since its keys never covered a public copy.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_tag:
        description: "A published release tag to copy to the public release location, such as v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/release-gate.yml
    with:
      release: ${{ inputs.upload_tag || github.ref_name }}
      commit: ${{ inputs.upload_tag == '' && github.sha || '' }}

  build:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # to find the conformance run on this commit, read its log and download its figures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: "3.12"
      - name: The tag, the package version and the change log agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" pyproject.toml
          grep -qx "__version__ = \"$version\"" src/fmverify/__init__.py
          grep -qx "## $version" CHANGELOG.md
      - run: python -m pip install build==1.6.1
      - name: Wheel, source archive and fixture archive, built twice and compared
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/build_release.py dist
          python tools/fixture_archive.py "$version" dist
          find src tests docs tools fixtures -type f -exec touch -d '2001-02-03 04:05:06' {} +
          (umask 077 && python tools/build_release.py "$RUNNER_TEMP/second" && python tools/fixture_archive.py "$version" "$RUNNER_TEMP/second")
          for f in dist/*; do cmp "$f" "$RUNNER_TEMP/second/$(basename "$f")"; done
      - name: The built wheel conforms, on the archived fixtures
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/suite" && tar -xf "dist/fm-verify-fixtures-$version.tar" -C "$RUNNER_TEMP/suite"
          cd "$RUNNER_TEMP" && fm-verify conformance "suite/fm-verify-fixtures-$version"
      - name: The scoreboard, recomputed from this commit's verdicts and by the built wheel on the archived fixtures, each figure traced to the conformance run on main at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/conformance.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then echo "no successful conformance run on main at $GITHUB_SHA: no figure could be traced"; exit 1; fi
          python tools/scoreboard.py "$version" dist --commit "$GITHUB_SHA" --fixtures "$RUNNER_TEMP/suite/fm-verify-fixtures-$version" --run "$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/conformance.log"
          python tools/scoreboard.py --check-log "$RUNNER_TEMP/conformance.log" "dist/fm-verify-scoreboard-$version.json"
      - name: The scoreboard manifest (scoreboard-manifest/1.0), each figure read from the file the same run kept and checked against the scoreboard above
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["trace"]["run_id"])' < "dist/fm-verify-scoreboard-${GITHUB_REF_NAME#v}.json")
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name scoreboard-figures --dir "$RUNNER_TEMP/outputs/$run_id"
          python tools/scoreboard.py --manifest dist --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --run "$run_id" --outputs "$RUNNER_TEMP/outputs"
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1, node24
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1, node24
        with:
          name: release
          path: dist
      - name: GitHub release with the change log's section and the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## $version" '$0 == h {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          { echo; python3 tools/scoreboard.py --line "dist/fm-verify-scoreboard-$version.json"
            echo; echo "SHA-256 of the files below (rebuild them from this tag with tools/build_release.py,"
            echo "tools/fixture_archive.py and tools/scoreboard.py, and compare; scoreboard-manifest.json with"
            echo "its made_at given as --made-at):"; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "fm-verify $version" --notes-file notes.md

  blob:
    # after the GitHub release on a tag push; alone after the gate when run by hand with upload_tag
    needs: [gate, publish]
    if: >-
      always() && needs.gate.result == 'success' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.upload_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
        with:
          fetch-depth: 0
          # always the tagged commit's code, the code both keys reviewed, on a tag push and with upload_tag alike
          ref: refs/tags/${{ inputs.upload_tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, node24
        with:
          node-version: "22"
          package-manager-cache: false
      - name: The published release, every file checked, assembled for its prefix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail  # a failed check must stop the job, not vanish into tee
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$TAG is not a release tag" >&2; exit 1; }
          [ -f tools/blob_release.py ] && [ -f tools/blob/publish.mjs ] \
            || { echo "$TAG's tree has no tools/blob_release.py: its keys did not cover a public copy" >&2; exit 1; }
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "$TAG does not point at a commit on main" >&2; exit 1; }
          commit=$(git rev-parse "$TAG^{commit}")
          git show "origin/main:gate/records/$TAG.json" > "$RUNNER_TEMP/gate.json"
          git show "$TAG:LICENSE" > "$RUNNER_TEMP/LICENSE"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          python tools/blob_release.py assemble --release "$RUNNER_TEMP/release" --tag "$TAG" --commit "$commit" \
            --gate "$RUNNER_TEMP/gate.json" --licence "$RUNNER_TEMP/LICENSE" --out pub | tee -a "$GITHUB_STEP_SUMMARY"
          (cd tools/blob && npm ci --ignore-scripts --no-audit --no-fund)  # @vercel/blob pinned by package-lock.json
          node tools/blob/publish.mjs --dir pub --prefix "verify-$TAG" --dry-run
      - name: Upload to the public release location
        id: upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.CAPITAL_GRAPH_BLOB_TOKEN }}
        run: |
          set -o pipefail
          test -n "$BLOB_READ_WRITE_TOKEN" || { echo "the secret CAPITAL_GRAPH_BLOB_TOKEN is not set" >&2; exit 1; }
          node tools/blob/publish.mjs --dir pub --prefix "verify-$TAG" | tee "$RUNNER_TEMP/blob.jsonl"
          url=$(tail -n 1 "$RUNNER_TEMP/blob.jsonl" | python3 -c "import json,sys; print(json.load(sys.stdin)['manifest_url'])")
          [[ "$url" == https://*/"verify-$TAG"/manifest.json ]] || { echo "unexpected manifest URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: The store serves every file as assembled
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          set -o pipefail
          python tools/blob_release.py check --base "${URL%/manifest.json}" --dir pub | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Manifest URL: $URL" >> "$GITHUB_STEP_SUMMARY"
