name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Conformance suite
        run: fm-verify conformance fixtures
      - name: Fixtures rebuild byte for byte
        run: |
          python tools/make_fixtures.py
          git diff --exit-code -- fixtures

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,interop]"
      - run: python -m pytest -q tests/test_interop.py tests/test_interop_pdf.py tests/test_jcs.py -rs

  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - name: The verifier's wheel and source archive rebuild byte for byte
        run: |
          python tools/build_release.py "$RUNNER_TEMP/first"
          find src tests docs tools -type f -exec touch -d '2001-02-03 04:05:06' {} +
          (umask 077 && python tools/build_release.py "$RUNNER_TEMP/second")
          cmp "$RUNNER_TEMP"/first/*.whl "$RUNNER_TEMP"/second/*.whl
          cmp "$RUNNER_TEMP"/first/*.tar.gz "$RUNNER_TEMP"/second/*.tar.gz
      - name: The built wheel conforms
        run: |
          python -m pip install "$RUNNER_TEMP"/first/*.whl
          cd "$RUNNER_TEMP" && fm-verify conformance "$GITHUB_WORKSPACE/fixtures"

  pyodide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, node24
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run the API under Pyodide, as a browser would
        run: |
          mkdir -p "$RUNNER_TEMP/pyodide"
          cd "$RUNNER_TEMP/pyodide"
          npm init -y > /dev/null
          npm install --silent pyodide@0.27.7
          cp "$GITHUB_WORKSPACE/tools/pyodide/check.mjs" .
          node check.mjs "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: "3.12"
      - name: In a browser, under the hosted page's Content Security Policy (docs/HOSTED_PAGE.md)
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp tools/pyodide/policy/index.html tools/pyodide/policy/app.mjs tools/pyodide/policy/check.mjs "$site"
          for f in pyodide.mjs pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            cp "$RUNNER_TEMP/pyodide/node_modules/pyodide/$f" "$site"
          done
          python tools/pyodide/policy/fetch_packages.py "$site" cryptography
          python -m pip wheel --quiet --no-deps --wheel-dir "$site" .
          (cd "$site" && ls fundingmachine_verify-*.whl > wheel.txt)
          style=$(PYTHONPATH=src python -c 'from fmverify.report import CSP_STYLE_HASH; print(CSP_STYLE_HASH)')
          cd "$site"
          npm init -y > /dev/null
          npm install --silent playwright-core@1.56.1
          node check.mjs "$GITHUB_WORKSPACE" "$style"

  page:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, node24
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, node24
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build==1.6.1
      - name: Build the anchors page (docs/HOSTED_PAGE.md, section 11)
        run: |
          mkdir -p "$RUNNER_TEMP/node" && cd "$RUNNER_TEMP/node"
          npm init -y > /dev/null
          npm install --silent pyodide@0.27.7 playwright-core@1.56.1
          cd "$GITHUB_WORKSPACE"
          python tools/build_page.py "$RUNNER_TEMP/site" --pyodide "$RUNNER_TEMP/node/node_modules/pyodide"
      - name: In Chrome, under its own policy, against the mirror at 98e2443 and the headers its verdict relied on
        run: |
          git clone --quiet https://github.com/Korentsvit/fundingmachine-anchors "$RUNNER_TEMP/mirror"
          git -C "$RUNNER_TEMP/mirror" checkout --quiet 98e2443bacfafb4dc46c9d4f7f28053867c4f9f6
          cp tools/pyodide/page/check.mjs "$RUNNER_TEMP/node/"
          cd "$RUNNER_TEMP/node"
          node check.mjs "$RUNNER_TEMP/site" "$RUNNER_TEMP/mirror" 98e2443bacfafb4dc46c9d4f7f28053867c4f9f6 \
            "$GITHUB_WORKSPACE/verdicts/ledger-anchors/2026-10-17T1218Z/headers.txt"
