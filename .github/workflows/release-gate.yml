name: release-gate

# The two-key release gate (gate/README.md). A release path calls this workflow before it publishes: it reads
# gate/records/<release>.json from main and fails unless both keys are recorded for the exact commit the
# release publishes, and hands the publishing job the release name and commit it passed (outputs release and
# commit): a Blob upload writes under <release>/ and nothing else. On a pull request that touches gate/ or a
# workflow it runs the gate's self-test, checks every record and checks that every job that publishes runs only
# after this gate (node gate/check.mjs workflows). Reads no secret, writes nothing, about one minute.

on:
  workflow_call:
    inputs:
      release:
        description: "Release name: the record's file name without .json, and the tag name for a tag release"
        required: true
        type: string
      commit:
        description: "Full SHA the release publishes (empty: the commit of the tag named like the release)"
        required: false
        type: string
        default: ""
    outputs:
      release:
        description: "The release name the gate passed; a Blob upload writes under <release>/ only"
        value: ${{ jobs.gate.outputs.release }}
      commit:
        description: "The full SHA the gate passed; the only commit the release may publish"
        value: ${{ jobs.gate.outputs.commit }}
  pull_request:
    paths:
      - "gate/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.keys.outputs.release }}
      commit: ${{ steps.keys.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
        with:
          ref: ${{ inputs.release != '' && 'main' || '' }}
          fetch-depth: 0
      - name: Two keys
        id: keys
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$RELEASE" ]; then
            node gate/check.mjs release "$RELEASE" "$COMMIT"
          else
            node gate/check.mjs self-test
            node gate/check.mjs records
            node gate/check.mjs workflows
          fi
