name: release-gate

# The two-key release gate (gate/README.md). A release path calls this workflow before it publishes: it reads
# gate/records/<release>.json from main and fails unless both keys are recorded for the exact commit the
# release publishes. On a pull request that touches gate/ it runs the gate's self-test and checks every record.
# Reads no secret, writes nothing, about one minute.

on:
  workflow_call:
    inputs:
      release:
        description: "Release name: the record's file name without .json, and the tag name for a tag release"
        required: true
        type: string
      commit:
        description: "Full SHA the release publishes (empty: the commit of the tag named like the release)"
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - "gate/**"
      - ".github/workflows/release-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release != '' && 'main' || '' }}
          fetch-depth: 0
      - name: Two keys
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$RELEASE" ]; then
            node gate/check.mjs release "$RELEASE" "$COMMIT"
          else
            node gate/check.mjs self-test
            node gate/check.mjs records
          fi
